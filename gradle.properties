# Project-wide Gradle settings

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Use AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Gradle Configuration Cache
org.gradle.configuration-cache=true

# Enable Gradle Build Cache
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Non-transitive R classes (better build performance)
android.nonTransitiveRClass=true

# Default SDK versions (overridable per module)
android.defaults.buildfeatures.buildconfig=true

# Disable build features by default (modules opt-in)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
